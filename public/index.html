<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mine To Earn</title>
<style>
body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:24px}
h1{font-size:34px}.sub{color:#9ca3af}.card{background:#151a24;border:1px solid #293246;border-radius:24px;padding:22px;margin:16px 0}
.coins{font-size:38px;font-weight:800;margin:12px 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{border:0;border-radius:18px;padding:22px 10px;background:#263149;color:#fff;font-size:19px;font-weight:700}
.price{display:block;color:#aeb8ca;font-size:15px;margin-top:8px}#status{color:#7ee787;margin-top:14px}
</style></head><body><div class="wrap">
<h1>⛏️ MINE TO EARN</h1><div class="sub">Зрители против стримера</div>
<div class="card"><div>🪙 Тестовые монеты</div><div class="coins" id="coins">100</div>
<button onclick="addCoins()">＋ Получить тестовые монеты</button></div>
<div class="card"><h2>💀 АТАКА НА СТРИМЕРА</h2><div class="grid">
<button onclick="eventSend('zombie',25)">🧟 Зомби<span class="price">25 🪙</span></button>
<button onclick="eventSend('tnt',50)">💣 TNT<span class="price">50 🪙</span></button>
<button onclick="eventSend('lightning',30)">⚡ Молния<span class="price">30 🪙</span></button>
<button onclick="eventSend('creepers',60)">💥 5 криперов<span class="price">60 🪙</span></button>
<button onclick="eventSend('catastrophe',150)">🌋 Катастрофа<span class="price">150 🪙</span></button>
<button onclick="eventSend('dragon',500)">🐉 ДРАКОН<span class="price">500 🪙</span></button>
</div><div id="status">Система готова. Тестовый режим.</div></div></div>
<script>
let coins=100;function render(){document.getElementById("coins").textContent=coins}
function addCoins(){coins+=100;render();document.getElementById("status").textContent="Получено 100 тестовых монет!"}
async function eventSend(event,cost){if(coins<cost){document.getElementById("status").textContent="Не хватает монет.";return}
coins-=cost;render();const r=await fetch("/api/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event})});
const d=await r.json();document.getElementById("status").textContent=d.ok?"Ивент отправлен: "+event:"Ошибка отправки"}
</script></body></html
